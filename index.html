// === FIL-TREK LAYOUT ===
const LAYOUT={aisles:{S01:{x:8,yS:28,yE:72},S02:{x:16,yS:28,yE:72},S03:{x:24,yS:28,yE:72},S04:{x:32,yS:28,yE:72},S05:{x:40,yS:28,yE:72},S06:{x:48,yS:28,yE:72}},w:85,h:80,start:{x:28,y:25}};
function shelfXY(code){
  if(!code||code==='S0000A'||code.startsWith('S00'))return{x:35,y:50,floating:true};
  const m=code.match(/S(\d{2})(\d{2})([AB])/);if(!m)return{x:35,y:50,floating:true};
  const a=LAYOUT.aisles[`S0${parseInt(m[1])}`];if(!a)return{x:35,y:50,floating:true};
  const t=parseInt(m[2])/20,y=a.yS+(a.yE-a.yS)*t,xo=m[3]==='A'?-2:2;
  return{x:a.x+xo,y,floating:false};
}
const Opt={
  dist(a,b){if(Math.abs(a.x-b.x)<6)return Math.abs(a.y-b.y);return Math.min(Math.abs(a.y-25)+Math.abs(a.x-b.x)+Math.abs(b.y-25),Math.abs(a.y-75)+Math.abs(a.x-b.x)+Math.abs(b.y-75))},
  optimize(items){if(items.length<=2)return items;const coords=items.map(it=>({...it,...shelfXY(it.shelf)}));const un=[...coords],rt=[];let cur=LAYOUT.start;while(un.length){let ni=0,nd=Infinity;un.forEach((u,i)=>{const d=this.dist(cur,u);if(d<nd){nd=d;ni=i}});cur=un[ni];rt.push(un.splice(ni,1)[0])}let imp=true;while(imp){imp=false;for(let i=0;i<rt.length-2;i++)for(let j=i+2;j<rt.length;j++){const d1=this.dist(rt[i],rt[i+1])+this.dist(rt[j],rt[(j+1)%rt.length]),d2=this.dist(rt[i],rt[j])+this.dist(rt[i+1],rt[(j+1)%rt.length]);if(d2<d1){rt.splice(i+1,j-i,...rt.slice(i+1,j+1).reverse());imp=true}}}return rt},
  est(rt){let d=0,p=LAYOUT.start;rt.forEach(it=>{d+=this.dist(p,it);p=it});d+=this.dist(p,LAYOUT.start);const t=Math.round(d/1.2);return{distM:Math.round(d),travelSec:t,pickSec:rt.length*15,totalSec:t+rt.length*15}}
};

// === DB ===
class DB{constructor(){this.db=null}
  async init(){return new Promise((ok,f)=>{const r=indexedDB.open('WIQ_PROD',6);r.onupgradeneeded=e=>{const d=e.target.result;['picklists','inventory','users','activityLog'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=e=>{this.db=e.target.result;ok()};r.onerror=e=>f(e.target.error)})}
  _t(s,m='readonly'){return this.db.transaction(s,m).objectStore(s)}
  all(s){return new Promise((ok,f)=>{const r=this._t(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>f(r.error)})}
  put(s,d){return new Promise((ok,f)=>{const r=this._t(s,'readwrite').put(d);r.onsuccess=()=>ok();r.onerror=()=>f(r.error)})}
  del(s,k){return new Promise((ok,f)=>{const r=this._t(s,'readwrite').delete(k);r.onsuccess=()=>ok();r.onerror=()=>f(r.error)})}
  clear(s){return new Promise((ok,f)=>{const r=this._t(s,'readwrite').clear();r.onsuccess=()=>ok();r.onerror=()=>f(r.error)})}
}
const db=new DB();

class Scn{constructor(){this.stream=null;this.det=null;this.on=false;this.raf=null}async init(){if('BarcodeDetector' in window)this.det=new BarcodeDetector({formats:await BarcodeDetector.getSupportedFormats()});return!!this.det}async cam(v){try{this.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});v.srcObject=this.stream;await v.play();return true}catch(e){return false}}async scan(v,cb){if(!this.det)return false;this.on=true;const l=async()=>{if(!this.on)return;try{const b=await this.det.detect(v);if(b.length){cb(b[0].rawValue);this.on=false;setTimeout(()=>{this.on=true;this.raf=requestAnimationFrame(l)},1500);return}}catch(e){}this.raf=requestAnimationFrame(l)};this.raf=requestAnimationFrame(l);return true}stop(){this.on=false;if(this.raf)cancelAnimationFrame(this.raf);if(this.stream)this.stream.getTracks().forEach(t=>t.stop());this.stream=null}}

        <div className="f g6" style={{marginBottom:16}}>{cur.shelf==='S0000A'||cur.floating?<span className="bd8 by8">⚠ S0000A — CHECK FLOOR</span>:<><span className="bd8 ba">{cur.shelf}</span></>}</div>

/* === DASHBOARD === */
function Dash(){

  const m=useMemo(()=>{const c={today:864e5,week:6048e5,month:25920e5};const since=Date.now()-(c[range]||c.today);const r=log.filter(l=>l.ts>=since),picks=r.filter(l=>l.type==='pick'),errs=r.filter(l=>l.type==='error');const done=pls.filter(p=>p.status==='completed'&&p.completedAt>=since);const ws=users.filter(u=>u.role==='worker').map(w=>{const wp=picks.filter(p=>p.uid===w.id),we=errs.filter(e=>e.uid===w.id);return{...w,picks:wp.reduce((s,p)=>s+(p.qty||1),0),errors:we.length,done:done.filter(d=>d.to===w.id).length,acc:wp.length?Math.round(((wp.length-we.length)/wp.length)*100):100}});const tp=picks.reduce((s,p)=>s+(p.qty||1),0);const hrs={};for(let h=6;h<=22;h++)hrs[h]=0;picks.forEach(p=>{const h=new Date(p.ts).getHours();if(hrs[h]!==undefined)hrs[h]+=(p.qty||1)});return{tp,errs:errs.length,done:done.length,active:pls.filter(p=>p.status==='active').length,low:inv.filter(i=>i.qty<=i.min).length,acc:tp?Math.round(((tp-errs.length)/tp)*100):100,ws,hrs}},[pls,log,users,inv,range]);
  const mh=Math.max(...Object.values(m.hrs),1);
  return<><TB title="Dashboard"/><div className="pg pin">
    <div className="sec"><div className="tabs" style={{marginBottom:14}}>{['today','week','month'].map(t=><div key={t} className={`tab ${range===t?'on':''}`} onClick={()=>setRange(t)}>{t[0].toUpperCase()+t.slice(1)}</div>)}</div>
      <div className="g2"><div className="st8"><div className="sv" style={{color:'var(--acc)'}}>{m.tp}</div><div className="sl">Picked</div></div><div className="st8"><div className="sv" style={{color:'var(--grn)'}}>{m.acc}%</div><div className="sl">Accuracy</div></div><div className="st8"><div className="sv" style={{color:'var(--blu)'}}>{m.done}</div><div className="sl">Completed</div></div><div className="st8"><div className="sv" style={{color:m.low?'var(--red)':'var(--grn)'}}>{m.low}</div><div className="sl">Low Stock</div></div></div></div>
    {Object.values(m.hrs).some(v=>v>0)&&<div className="sec"><div className="cd"><div className="h3" style={{marginBottom:10}}>Picks by Hour</div><div className="cbr">{Object.entries(m.hrs).map(([h,v])=><div key={h} className="ccol"><div className="cbar" style={{height:`${Math.max((v/mh)*100,2)}%`,opacity:v?0.4+(v/mh)*0.6:0.15}}/><div className="chr">{h}</div></div>)}</div></div></div>}
    {m.ws.length>0&&<div className="sec"><div className="h2" style={{marginBottom:10}}>Workers</div><div className="fc g8">{m.ws.map(w=><div key={w.id} className="pfr"><div className={`av ${w.acc>=95?'avg':'ava'}`}>{w.av}</div><div className="f1"><div style={{fontWeight:700,fontSize:'0.85rem'}}>{w.name}</div><div className="f g12" style={{marginTop:3,fontSize:'0.7rem'}}><span style={{color:'var(--acc)'}}>{w.picks} picks</span><span style={{color:'var(--grn)'}}>{w.acc}%</span></div></div><div className="tc"><div className="mono" style={{fontWeight:800}}>{w.done}</div><div className="lb">Orders</div></div></div>)}</div></div>}
    {log.length>0&&<div className="sec"><div className="h2" style={{marginBottom:10}}>Activity</div><div className="fc g4">{log.slice(0,15).map(l=>{const u=users.find(x=>x.id===l.uid);const c={pick:'g8',error:'r8',scan:'b8',login:'ba',logout:'by8',start_pl:'bc8',adj:'y8'};return<div key={l.id} className="f fi g8" style={{padding:'8px 0',borderBottom:'1px solid var(--bdr)'}}><span className={`bd8 b${c[l.type]||'b8'}`} style={{minWidth:48,justifyContent:'center',fontSize:'0.55rem'}}>{l.type}</span><div className="f1" style={{fontSize:'0.78rem'}}><span style={{fontWeight:600}}>{u?.name||l.uid}</span>{l.sku&&<span style={{color:'var(--t3)'}}> · {l.sku}</span>}{l.msg&&<span style={{color:'var(--t3)'}}> · {l.msg}</span>}{l.qty&&<span style={{color:'var(--acc)'}}> ×{l.qty}</span>}</div><span className="mono" style={{color:'var(--t4)',fontSize:'0.65rem'}}>{new Date(l.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>})}</div></div>}
  </div></>;

/* === ADMIN — Full CRUD: users, inventory, pick lists, CSV import, factory reset === */
function Admin(){
  const{user,logout,users,inv,pls,flash,addUser,delUser,saveInv,delInv,savePL,delPL,addLog,resetAll}=useContext(Ctx);
  const[modal,setModal]=useState(null);// 'addUser','addItem','importCSV','addPL','resetConfirm'
  const[nu,setNu]=useState({name:'',role:'worker',pin:''});
  const[ni,setNi]=useState({sku:'',name:'',shelf:'S0000A',qty:'0',min:'5',cat:'General'});
  const[np,setNp]=useState({name:'',priority:'medium',to:'',items:[]});
  const[csv,setCsv]=useState('');
  const[plItems,setPlItems]=useState([]);
  const[confirmReset,setConfirmReset]=useState('');
  const fileRef=useRef(null);

  const doAddUser=async()=>{if(!nu.name.trim()||nu.pin.length!==4){flash('Name + 4-digit PIN required','err');return}const av=nu.name.trim().split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);const u={id:uid(),name:nu.name.trim(),role:nu.role,pin:nu.pin,av};await addUser(u);flash(`Added ${u.name}`,'ok');setModal(null);setNu({name:'',role:'worker',pin:''})};
  const doAddItem=async()=>{if(!ni.sku.trim()||!ni.name.trim()){flash('SKU and name required','err');return}const it={id:iid(),sku:ni.sku.trim().toUpperCase(),name:ni.name.trim(),shelf:ni.shelf.trim().toUpperCase()||'S0000A',qty:parseInt(ni.qty)||0,min:parseInt(ni.min)||5,cat:ni.cat.trim()||'General'};await saveInv(it);addLog({type:'inv_add',uid:user.id,sku:it.sku});flash(`Added ${it.sku}`,'ok');setModal(null);setNi({sku:'',name:'',shelf:'S0000A',qty:'0',min:'5',cat:'General'})};
  const doImportCSV=async()=>{
    const lines=csv.trim().split('\n').filter(l=>l.trim());if(lines.length<2){flash('Need header + data rows','err');return}
    const hdr=lines[0].split(',').map(h=>h.trim().toLowerCase());const skuI=hdr.indexOf('sku'),nameI=hdr.indexOf('name'),shelfI=hdr.indexOf('shelf'),qtyI=hdr.indexOf('qty'),minI=hdr.indexOf('min'),catI=hdr.indexOf('category');
    if(skuI===-1||nameI===-1){flash('CSV must have sku and name columns','err');return}
    let count=0;
    for(let i=1;i<lines.length;i++){const cols=lines[i].split(',').map(c=>c.trim());if(!cols[skuI])continue;
      await saveInv({id:iid()+i,sku:cols[skuI].toUpperCase(),name:cols[nameI]||'',shelf:(cols[shelfI]||'S0000A').toUpperCase(),qty:parseInt(cols[qtyI])||0,min:parseInt(cols[minI])||5,cat:cols[catI]||'General'});count++}
    flash(`Imported ${count} items`,'ok');setModal(null);setCsv('');
  };
  const doAddPL=async()=>{if(!np.name.trim()){flash('Name required','err');return}if(!plItems.length){flash('Add at least 1 item','err');return}
    const pl={id:pid(),name:np.name.trim(),status:'active',priority:np.priority,to:np.to||null,created:Date.now(),items:plItems.map(pi=>({invId:pi.id,sku:pi.sku,name:pi.name,shelf:pi.shelf,need:pi.need,picked:0,status:'pending'}))};
    await savePL(pl);addLog({type:'pl_create',uid:user.id,pl:pl.id});flash('Pick list created','ok');setModal(null);setNp({name:'',priority:'medium',to:'',items:[]});setPlItems([])};
  const handleFile=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setCsv(ev.target.result);setModal('importCSV')};r.readAsText(f)};

  return<><TB title="Admin"/><div className="pg pin">
    <div className="sec"><div className="cd"><div className="f fi g12"><div className="av ava" style={{width:48,height:48,fontSize:'0.95rem'}}>{user?.av}</div><div><div style={{fontWeight:800,fontSize:'1rem'}}>{user?.name}</div><span className={`bd8 b${user?.role==='admin'?'a':'b8'}`}>{user?.role}</span></div></div></div></div>

    {/* Quick actions */}
    <div className="sec"><div className="h2" style={{marginBottom:10}}>Manage</div>
      <div className="fc g8">
        <button className="btn bp bfull" onClick={()=>setModal('addUser')}><I.Plus style={{width:16,height:16}}/>Add User</button>
        <button className="btn bp bfull" onClick={()=>setModal('addItem')}><I.Plus style={{width:16,height:16}}/>Add Inventory Item</button>
        <button className="btn bg bfull" onClick={()=>fileRef.current?.click()}><I.Upload style={{width:16,height:16}}/>Import CSV</button>
        <input ref={fileRef} type="file" accept=".csv,.txt" style={{display:'none'}} onChange={handleFile}/>
        <button className="btn bp bfull" onClick={()=>{setPlItems([]);setNp({name:'',priority:'medium',to:'',items:[]});setModal('addPL')}}><I.Plus style={{width:16,height:16}}/>Create Pick List</button>
      </div>
    </div>

    {/* Users list */}
    <div className="sec"><div className="f fb fi" style={{marginBottom:10}}><div className="h2">Users ({users.length})</div></div>
    <div className="fc g8">{users.map(u=><div key={u.id} className="pfr"><div className={`av av${u.role==='admin'?'a':u.role==='supervisor'?'b':'g'}`}>{u.av}</div><div className="f1"><div style={{fontWeight:600}}>{u.name}</div><div style={{color:'var(--t4)',fontSize:'0.7rem'}}>{u.role} · PIN: {u.pin}</div></div>{u.id!==user.id&&<button className="btn bd bsm bicon" style={{minHeight:36,width:36}} onClick={async()=>{await delUser(u.id);flash(`Removed ${u.name}`,'ok')}}><I.Trash style={{width:14,height:14}}/></button>}</div>)}</div></div>

    {/* Active pick lists */}
    {pls.filter(p=>p.status==='active').length>0&&<div className="sec"><div className="h2" style={{marginBottom:10}}>Active Pick Lists</div><div className="fc g8">{pls.filter(p=>p.status==='active').map(pl=><div key={pl.id} className="pfr"><div className="f1"><div style={{fontWeight:600,fontSize:'0.85rem'}}>{pl.name}</div><div style={{color:'var(--t4)',fontSize:'0.7rem'}}>{pl.items.length} items · {users.find(u=>u.id===pl.to)?.name||'Unassigned'}</div></div><button className="btn bd bsm bicon" style={{minHeight:36,width:36}} onClick={async()=>{await delPL(pl.id);flash('Deleted','ok')}}><I.Trash style={{width:14,height:14}}/></button></div>)}</div></div>}

    {/* System */}
    <div className="sec"><div className="cd"><div className="h3" style={{marginBottom:8}}>Facility</div><div className="fc g4" style={{fontSize:'0.82rem'}}><div className="f fb"><span style={{color:'var(--t4)'}}>Site</span><span>Fil-Trek After Market</span></div><div className="f fb"><span style={{color:'var(--t4)'}}>Address</span><span>120 Sheldon Dr, Cambridge ON</span></div><div className="f fb"><span style={{color:'var(--t4)'}}>Aisles</span><span className="mono">S01–S06</span></div><div className="f fb"><span style={{color:'var(--t4)'}}>Shelf Format</span><span className="mono">S{'{'}01-06{'}'}{'{'}01-20{'}'}{'{'}A/B{'}'}</span></div><div className="f fb"><span style={{color:'var(--t4)'}}>Float Code</span><span className="mono" style={{color:'var(--yel)'}}>S0000A</span></div></div></div></div>

    <div className="sec fc g8">
      <button className="btn bd bfull" onClick={()=>setModal('resetConfirm')}><I.Trash style={{width:16,height:16}}/>Factory Reset — Erase All Data</button>
      <button className="btn bg bfull" onClick={logout}><I.Out style={{width:16,height:16}}/>Sign Out</button>
    </div>

    {/* === MODALS === */}
    {modal==='addUser'&&<div className="mbg" onClick={()=>setModal(null)}><div className="msh" onClick={e=>e.stopPropagation()}><div className="mgrip"/><div className="h2" style={{marginBottom:16}}>Add User</div><div className="fc g12">
      <div><div className="lb" style={{marginBottom:6}}>Full Name</div><input className="inp" value={nu.name} onChange={e=>setNu({...nu,name:e.target.value})} placeholder="e.g. Mike Thompson"/></div>
      <div><div className="lb" style={{marginBottom:6}}>Role</div><select value={nu.role} onChange={e=>setNu({...nu,role:e.target.value})}><option value="worker">Worker</option><option value="supervisor">Supervisor</option><option value="admin">Admin</option></select></div>
      <div><div className="lb" style={{marginBottom:6}}>4-Digit PIN</div><input className="inp mono" type="tel" maxLength={4} placeholder="0000" value={nu.pin} onChange={e=>setNu({...nu,pin:e.target.value.replace(/\D/g,'').slice(0,4)})}/></div>
      <button className="btn bp bfull" onClick={doAddUser}>Add User</button><button className="btn bg bfull" onClick={()=>setModal(null)}>Cancel</button>
    </div></div></div>}

    {modal==='addItem'&&<div className="mbg" onClick={()=>setModal(null)}><div className="msh" onClick={e=>e.stopPropagation()}><div className="mgrip"/><div className="h2" style={{marginBottom:16}}>Add Inventory Item</div><div className="fc g12">
      <div><div className="lb" style={{marginBottom:6}}>SKU (Part Number)</div><input className="inp mono" value={ni.sku} onChange={e=>setNi({...ni,sku:e.target.value})} placeholder="e.g. BRG-4210"/></div>
      <div><div className="lb" style={{marginBottom:6}}>Description</div><input className="inp" value={ni.name} onChange={e=>setNi({...ni,name:e.target.value})} placeholder="e.g. Bearing Assembly 42mm"/></div>
      <div><div className="lb" style={{marginBottom:6}}>Shelf Location</div><input className="inp mono" value={ni.shelf} onChange={e=>setNi({...ni,shelf:e.target.value})} placeholder="e.g. S0106A or S0000A"/></div>
      <div className="g2"><div><div className="lb" style={{marginBottom:6}}>Qty on Hand</div><input className="inp mono" type="number" value={ni.qty} onChange={e=>setNi({...ni,qty:e.target.value})}/></div><div><div className="lb" style={{marginBottom:6}}>Min Qty</div><input className="inp mono" type="number" value={ni.min} onChange={e=>setNi({...ni,min:e.target.value})}/></div></div>
      <div><div className="lb" style={{marginBottom:6}}>Category</div><input className="inp" value={ni.cat} onChange={e=>setNi({...ni,cat:e.target.value})} placeholder="e.g. Seals, Mechanical"/></div>
      <button className="btn bp bfull" onClick={doAddItem}>Add Item</button><button className="btn bg bfull" onClick={()=>setModal(null)}>Cancel</button>
    </div></div></div>}

    {modal==='importCSV'&&<div className="mbg" onClick={()=>setModal(null)}><div className="msh" onClick={e=>e.stopPropagation()}><div className="mgrip"/><div className="h2" style={{marginBottom:8}}>Import CSV</div>
      <div style={{color:'var(--t3)',fontSize:'0.78rem',marginBottom:12}}>Required columns: <span className="mono">sku, name</span><br/>Optional: <span className="mono">shelf, qty, min, category</span></div>
      <textarea value={csv} onChange={e=>setCsv(e.target.value)} rows={8} placeholder={"sku,name,shelf,qty,min,category\nBRG-4210,Bearing Assembly 42mm,S0106A,150,25,Mechanical"} style={{fontFamily:'var(--fm)',fontSize:'0.72rem'}}/>
      <div style={{marginTop:12}} className="fc g8"><button className="btn bp bfull" onClick={doImportCSV}>Import</button><button className="btn bg bfull" onClick={()=>setModal(null)}>Cancel</button></div>
    </div></div>}

    {modal==='addPL'&&<div className="mbg" onClick={()=>setModal(null)}><div className="msh" onClick={e=>e.stopPropagation()}><div className="mgrip"/><div className="h2" style={{marginBottom:16}}>Create Pick List</div><div className="fc g12">
      <div><div className="lb" style={{marginBottom:6}}>Order / Name</div><input className="inp" value={np.name} onChange={e=>setNp({...np,name:e.target.value})} placeholder="e.g. SO#4521 — Seal Kit"/></div>
      <div className="g2"><div><div className="lb" style={{marginBottom:6}}>Priority</div><select value={np.priority} onChange={e=>setNp({...np,priority:e.target.value})}><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
      <div><div className="lb" style={{marginBottom:6}}>Assign To</div><select value={np.to} onChange={e=>setNp({...np,to:e.target.value})}><option value="">Unassigned</option>{users.filter(u=>u.role==='worker').map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></div></div>
      <div><div className="lb" style={{marginBottom:6}}>Add Items from Inventory</div>
        {inv.length===0?<div style={{color:'var(--t4)',fontSize:'0.8rem'}}>No inventory yet — add items first</div>
        :<div className="fc g6" style={{maxHeight:200,overflowY:'auto'}}>{inv.map(it=>{const inList=plItems.find(p=>p.id===it.id);return<div key={it.id} className="f fi g8" style={{padding:'8px 10px',background:inList?'var(--acc-d)':'var(--inp)',borderRadius:8,cursor:'pointer'}} onClick={()=>{if(inList)setPlItems(plItems.filter(p=>p.id!==it.id));else setPlItems([...plItems,{...it,need:1}])}}>
          <div style={{width:20,height:20,borderRadius:4,border:'2px solid '+(inList?'var(--acc)':'var(--bdr2)'),background:inList?'var(--acc)':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>{inList&&<I.Check style={{width:12,height:12,color:'#fff'}}/>}</div>
          <div className="f1"><span className="mono" style={{fontSize:'0.75rem',fontWeight:700}}>{it.sku}</span> <span style={{color:'var(--t3)',fontSize:'0.75rem'}}>{it.name}</span></div>
          <span className="mono" style={{fontSize:'0.7rem',color:'var(--t4)'}}>{it.shelf}</span>
        </div>})}</div>}
        {plItems.length>0&&<div style={{marginTop:8}}><div className="lb" style={{marginBottom:6}}>Set Quantities</div><div className="fc g4">{plItems.map((pi,idx)=><div key={pi.id} className="f fi g8"><span className="mono" style={{fontSize:'0.72rem',flex:1}}>{pi.sku}</span><input className="inp mono" type="number" min="1" value={pi.need} onChange={e=>{const n=[...plItems];n[idx]={...n[idx],need:parseInt(e.target.value)||1};setPlItems(n)}} style={{width:70,minHeight:40,padding:'8px',textAlign:'center'}}/></div>)}</div></div>}
      </div>
      <button className="btn bp bfull" onClick={doAddPL} disabled={!np.name.trim()||!plItems.length}>Create Pick List ({plItems.length} items)</button><button className="btn bg bfull" onClick={()=>setModal(null)}>Cancel</button>
    </div></div></div>}

    {modal==='resetConfirm'&&<div className="mbg" onClick={()=>setModal(null)}><div className="msh" onClick={e=>e.stopPropagation()}><div className="mgrip"/><div className="h2" style={{marginBottom:8,color:'var(--red)'}}>Factory Reset</div>
      <div style={{color:'var(--t3)',fontSize:'0.82rem',marginBottom:16}}>This will permanently delete ALL users, inventory, pick lists, and activity logs. This cannot be undone.</div>
      <div className="lb" style={{marginBottom:6}}>Type RESET to confirm</div><input className="inp mono" value={confirmReset} onChange={e=>setConfirmReset(e.target.value)} placeholder="RESET"/>
      <div className="fc g8" style={{marginTop:12}}><button className="btn bd bfull" disabled={confirmReset!=='RESET'} onClick={async()=>{await resetAll();flash('All data erased','ok');setModal(null);setConfirmReset('')}}>Erase Everything</button><button className="btn bg bfull" onClick={()=>{setModal(null);setConfirmReset('')}}>Cancel</button></div>
    </div></div>}
  </div></>;
}

/* === APP === */
function App(){
  const{user,ready,online}=useContext(Ctx);const[tab,setTab]=useState('picks');
  if(!ready)return<div className="fc fi fj" style={{height:'100vh'}}><div className="amb"/><div style={{width:56,height:56,borderRadius:14,background:'linear-gradient(135deg,#ff6b00,#ff8a33)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.3rem',fontWeight:900,color:'#fff',boxShadow:'0 8px 32px rgba(255,107,0,0.3)',zIndex:1}}>S</div></div>;
  if(!user)return<Login/>;
  const V={picks:<Picks/>,scan:<ScanV/>,stock:<Stock/>,dash:<Dash/>,admin:<Admin/>};
  return<><div className="amb"/><div className="scnl"/>{!online&&<div className="ofl"><I.WifiOff style={{width:12,height:12}}/>Offline — syncs when connected</div>}<Toast/>{V[tab]||<Picks/>}<Nav tab={tab} set={setTab}/></>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Prov><App/></Prov>);
</script>
</body>
</html>
